packages:
  - kmod-qca-nss-crypto
  - kmod-qca-nss-drv-wifi-meshmgr
modules:
  - sqm-scripts-nss
diffconfig: |
  # 配置 512 内存，上游代码是 1G 内存
  CONFIG_ATH11K_MEM_PROFILE_512M=y
  # CONFIG_ATH11K_MEM_PROFILE_1G is not set
  CONFIG_IPQ_MEM_PROFILE_512=y
  # CONFIG_IPQ_MEM_PROFILE_1024 is not set
  CONFIG_NSS_MEM_PROFILE_MEDIUM=y
  # CONFIG_NSS_MEM_PROFILE_HIGH is not set
  # CONFIG_KERNEL_IPQ_MEM_PROFILE=512

  # 启用ATH11K无线芯片的Mesh网络硬件加速，优化Wi-Fi 6（802.11ax）设备的Mesh数据转发性能。
  CONFIG_ATH11K_NSS_MESH_SUPPORT=y
  # 禁用DTLS协议加速（用于UDP流量的加密，如某些VPN场景）。
  CONFIG_NSS_DRV_DTLS_ENABLE=y
  # 禁用TLS协议加速（影响HTTPS等加密流量处理）。
  CONFIG_NSS_DRV_TLS_ENABLE=y
  # 启用NSS对Wi-Fi Mesh的硬件加速，提升Mesh节点间的数据包处理效率。
  CONFIG_NSS_DRV_WIFI_MESH_ENABLE=y

# ATH11K与NSS的通用集成
# CONFIG_ATH11K_NSS_SUPPORT=y
# 基础网络功能
# 禁用桥接模式加速，影响跨接口数据转发性能。
# CONFIG_NSS_DRV_BRIDGE_ENABLE=y
# 禁用VLAN标签处理加速，影响虚拟局域网性能。
# CONFIG_NSS_DRV_VLAN_ENABLE=y
# 隧道协议
# 禁用GRE隧道加速（Generic Routing Encapsulation）
# CONFIG_NSS_DRV_GRE_ENABLE=y
# 禁用L2TP隧道加速（常用于VPN）。
# CONFIG_NSS_DRV_L2TP_ENABLE=y
# 禁用PPPoE协议加速（影响拨号上网性能）。
# CONFIG_NSS_DRV_PPPOE_ENABLE=y
# IPv6支持
# 禁用IPv6数据包处理加速，若网络需要IPv6建议启用。
# CONFIG_NSS_DRV_IPV6_ENABLE=y
# 高级功能
# 负载均衡与链路聚合
# 禁用链路聚合（LAG）加速，影响多端口绑定性能。
# CONFIG_NSS_DRV_LAG_ENABLE=y
# 流量控制与QoS
# 禁用流量整形（Shaper）加速，影响带宽管理。
# CONFIG_NSS_DRV_SHAPER_ENABLE=y
# 禁用QoS队列规则加速（如FQ_CODEL）。
# CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc=y
# 虚拟网络
# 禁用虚拟接口加速（如VETH、TAP设备）。
# CONFIG_NSS_DRV_VIRT_IF_ENABLE=y
# 固件与内存配置
# 指定NSS固件版本为11.4（需与硬件兼容）。
# CONFIG_NSS_FIRMWARE_VERSION_11_4=y
# 禁用高内存配置档（影响NSS内存分配，高负载场景建议启用）。
# CONFIG_NSS_MEM_PROFILE_HIGH=y
# 依赖模块
# NSS核心驱动模块（默认未启用，必须启用以支持其他功能）。
# CONFIG_PACKAGE_kmod-qca-nss-drv=y
# 禁用连接跟踪加速（ECM），显著影响NAT性能。
# CONFIG_PACKAGE_kmod-qca-nss-ecm=y

# CONFIG_NSS_DRV_IGS_ENABLE=y
